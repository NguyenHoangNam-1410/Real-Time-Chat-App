<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<style>
    body {
        background: linear-gradient(135deg, #e3f2fd, #ffffff);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .chat-container {
        max-width: 700px;
        margin: auto;
        padding: 30px;
        background: #e1e2e4;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    #chat {
        height: 400px;
        overflow-y: auto;
        padding: 20px;
        border-radius: 15px;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .chat-message {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 18px;
        max-width: 70%;
        word-wrap: break-word;
        font-size: 0.95rem;
        transition: all 0.2s ease-in-out;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .incoming {
        background-color: #e2e6ea;
        align-self: flex-start;
        border-top-left-radius: 0;
    }

    .outgoing {
        background-color: #0d6efd;
        color: white;
        align-self: flex-end;
        border-top-right-radius: 0;
    }

    .message-sender {
        font-weight: bold;
        margin-bottom: 4px;
        display: block;
    }

    .input-group {
        border-radius: 12px;
    }

    .form-control {
        border: none;
        padding: 14px;
    }

    .form-control:focus {
        box-shadow: none;
    }

    #send-button {
        background-color: #0d6efd;
        border: none;
    }

    #send-button:hover {
        background-color: #0b5ed7;
    }

    h3.text-center {
        font-weight: 600;
        color: #343a40;
    }

    #imageModal img {
        cursor: pointer;
    }

    .audio-player {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 25px;
        padding: 10px;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .audio-player audio {
        flex: 1;
        height: 35px;
    }

    .audio-info {
        font-size: 0.85rem;
        opacity: 0.8;
        margin-top: 5px;
    }

    .file-preview {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px;
        margin-top: 10px;
        display: none;
    }

    .file-preview.show {
        display: block;
    }

    .file-preview-content {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .file-type-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }

    .audio-icon {
        background: #ff6b6b;
        color: white;
    }

    .image-icon {
        background: #4ecdc4;
        color: white;
    }

    .file-info {
        flex: 1;
    }

    .file-name {
        font-weight: 500;
        margin-bottom: 2px;
    }

    .file-size {
        font-size: 0.8rem;
        opacity: 0.7;
    }
</style>

<div class="container mt-5">
    <div class="chat-container">
        <!-- Chat Header -->
        <h3 class="text-center mb-4">Chat Application</h3>

        <!-- Chat Box -->
        <div id="chat" class="d-flex flex-column"></div>

        <!-- User Input Section -->
        <div class="input-group mt-3">
            <input id="senderInput" type="text" class="form-control" placeholder="Enter your name">
        </div>

        <div class="input-group mt-3">
            <input id="messageInput" type="text" class="form-control" placeholder="Enter your message...">
            <button id="sendMessage" class="btn btn-primary" type="button">Send</button>
        </div>

        <div class="input-group mt-3" id="fileGroup">
            <input id="fileInput" type="file" class="form-control" accept="image/*,audio/*,.mp3,.wav,.ogg">
            <button class="btn btn-outline-danger" type="button" id="clearFile" title="Remove attachment">❌</button>
        </div>

        <!-- File Preview -->
        <div id="filePreview" class="file-preview">
            <div class="file-preview-content">
                <div id="fileTypeIcon" class="file-type-icon"></div>
                <div class="file-info">
                    <div id="fileName" class="file-name"></div>
                    <div id="fileSize" class="file-size"></div>
                </div>
            </div>
            <div id="audioPreview" style="margin-top: 10px; display: none;">
                <audio controls style="width: 100%;"></audio>
            </div>
            <div id="imagePreview" style="margin-top: 10px; display: none;">
                <img style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
        </div>

        <!-- Image Modal -->
        <div id="imageModal" class="modal" style="display:none; position:fixed; z-index:1050; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
            <img id="modalImage" style="max-width:90%; max-height:90%; border-radius:10px;">
        </div>
    </div>
</div>
</body>
<script>
    // Global variables
    var stompClient = null;

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
    }

    function connect() {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            // Successfully connected
            setConnected(true);
            console.log('Connected: ' + frame);
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            });
        }, function (error) {
            // Error when connecting
            console.error('Error connecting to WebSocket:', error);
            stompClient = null;
        });
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var messageElement = document.createElement('div');
        var isSender = document.getElementById('senderInput').value === message.sender;
        messageElement.className = 'chat-message ' + (isSender ? 'outgoing' : 'incoming');
        let content = `<span class="message-sender">${message.sender}:</span>`;

        if (message.message) content += `<div>${message.message}</div>`;

        if (message.imageData) {
            content += `<img src="${message.imageData}" style="max-width: 200px; margin-top: 5px; border-radius: 10px; cursor: pointer;">`;
        }

        if (message.audioData) {
            content += `
                    <div class="audio-player">
                        <audio controls>
                            <source src="${message.audioData}" type="audio/mpeg">
                            <source src="${message.audioData}" type="audio/wav">
                            <source src="${message.audioData}" type="audio/ogg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                    <div class="audio-info">🎵 Audio message</div>
                `;
        }

        messageElement.innerHTML = content;
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showFilePreview(file) {
        const preview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileTypeIcon = document.getElementById('fileTypeIcon');
        const audioPreview = document.getElementById('audioPreview');
        const imagePreview = document.getElementById('imagePreview');

        fileName.textContent = file.name;
        fileSize.textContent = formatFileSize(file.size);

        // Reset previews
        audioPreview.style.display = 'none';
        imagePreview.style.display = 'none';
        audioPreview.querySelector('audio').src = '';
        imagePreview.querySelector('img').src = '';

        if (file.type.startsWith('audio/')) {
            fileTypeIcon.className = 'file-type-icon audio-icon';
            fileTypeIcon.textContent = '🎵';

            // Show audio preview
            const audioURL = URL.createObjectURL(file);
            audioPreview.querySelector('audio').src = audioURL;
            audioPreview.style.display = 'block';
        } else if (file.type.startsWith('image/')) {
            fileTypeIcon.className = 'file-type-icon image-icon';
            fileTypeIcon.textContent = '🖼️';

            // Show image preview
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.querySelector('img').src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        preview.classList.add('show');
    }

    function hideFilePreview() {
        const preview = document.getElementById('filePreview');
        const audioPreview = document.getElementById('audioPreview');
        const imagePreview = document.getElementById('imagePreview');

        preview.classList.remove('show');

        // Clean up object URLs to prevent memory leaks
        const audio = audioPreview.querySelector('audio');
        if (audio.src) {
            URL.revokeObjectURL(audio.src);
            audio.src = '';
        }

        imagePreview.querySelector('img').src = '';
    }

    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            alert('Unable to send message. Not connected to the chat server.');
            return;
        }

        var sender = document.getElementById('senderInput').value;
        var message = document.getElementById('messageInput').value;
        var fileInput = document.getElementById('fileInput').files[0];

        if (sender.trim() === '' || (message.trim() === '' && !fileInput)) {
            alert('You must enter a message or select a file.');
            return;
        }

        // Check text message length limit (before file processing)
        if (message.trim() !== '') {
            const messageLength = message.length;
            const maxTextLength = 10000; // 10,000 characters limit

            if (messageLength > maxTextLength) {
                alert(`Message is too long (${messageLength.toLocaleString()} characters). Please limit to ${maxTextLength.toLocaleString()} characters or less.`);
                console.log(`Message length: ${messageLength} characters exceeds limit of ${maxTextLength} characters`);
                return;
            }

            // Warning for long messages
            if (messageLength > 1000) {
                console.log(`Long message detected: ${messageLength} characters`);
            }
        }

        if (fileInput) {
            // Check file size (limit to 5MB)
            const maxSize = 7.6 * 1024 * 1024; // 7.6MB in bytes
            if (fileInput.size > maxSize) {
                alert('File size too large, removing file to prevent send failure');

                // Clear the file input
                document.getElementById('fileInput').value = '';
                hideFilePreview();

                // Log user-friendly message
                console.log(`File removed: File was too large (>${(maxSize/(1024*1024)).toFixed(1)}MB). Please select a smaller file.`);

                // Return early to prevent sending
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const base64Data = e.target.result;

                // If it's an audio file, try to compress it
                if (fileInput.type.startsWith('audio/')) {
                    const fileSizeMB = (fileInput.size / (1024 * 1024)).toFixed(1);
                    console.log(`Audio file size: ${fileSizeMB}MB`);

                    // Estimate audio duration based on common formats
                    let estimatedMinutes;
                    if (fileInput.type.includes('wav')) {
                        estimatedMinutes = fileInput.size / (10 * 1024 * 1024); // ~10MB per minute for WAV
                    } else if (fileInput.type.includes('mp3')) {
                        estimatedMinutes = fileInput.size / (2.4 * 1024 * 1024); // ~2.4MB per minute for MP3 320kbps
                    } else {
                        estimatedMinutes = fileInput.size / (1.5 * 1024 * 1024); // ~1.5MB per minute average
                    }

                    if (estimatedMinutes > 3) {
                        console.log(`Warning: Audio file is approximately ${estimatedMinutes.toFixed(1)} minutes long. Consider using shorter clips for better performance.`);
                    }
                }

                const chatMessage = {
                    sender: sender,
                    message: message.trim() || null
                };

                // Determine if it's an image or audio file
                if (fileInput.type.startsWith('image/')) {
                    chatMessage.imageData = base64Data;
                } else if (fileInput.type.startsWith('audio/')) {
                    chatMessage.audioData = base64Data;
                }

                console.log('Sending message:', {
                    sender: chatMessage.sender,
                    hasMessage: !!chatMessage.message,
                    hasImage: !!chatMessage.imageData,
                    hasAudio: !!chatMessage.audioData,
                    dataSize: base64Data ? base64Data.length : 0
                });

                try {
                    stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
                    console.log('Message sent successfully');
                } catch (error) {
                    console.error('Error sending message:', error);
                    alert('Failed to send message. File might be too large or there was a connection error.');
                }
            };
            reader.onerror = function(error) {
                console.error('Error reading file:', error);
                alert('Error reading file. Please try again.');
            };
            reader.readAsDataURL(fileInput);
        } else {
            var chatMessage = { sender: sender, message: message };
            try {
                stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
                console.log('Text message sent successfully');
            } catch (error) {
                console.error('Error sending text message:', error);
                alert('Failed to send message. Please check your connection.');
            }
        }

        document.getElementById('messageInput').value = '';
        document.getElementById('fileInput').value = '';
        hideFilePreview();
    }

    // Ensure the DOM is fully loaded before binding events
    window.addEventListener('DOMContentLoaded', function () {
        document.getElementById('sendMessage').onclick = sendMessage;
        connect();

        // File input change event
        document.getElementById('fileInput').addEventListener('change', function (e) {
            if (e.target.files.length > 0) {
                showFilePreview(e.target.files[0]);
            } else {
                hideFilePreview();
            }
        });

        // Clear file button
        document.getElementById('clearFile').addEventListener('click', function () {
            document.getElementById('fileInput').value = '';
            hideFilePreview();
        });

        // Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Open modal on image click
        document.addEventListener('click', function (e) {
            if (e.target.tagName === 'IMG' && e.target.closest('.chat-message') && e.target.style.cursor === 'pointer') {
                var modal = document.getElementById('imageModal');
                var modalImg = document.getElementById('modalImage');
                modal.style.display = 'flex';
                modalImg.src = e.target.src;
            }
        });

        // Close modal when clicking outside the image
        document.getElementById('imageModal').addEventListener('click', function (e) {
            if (e.target.id === 'imageModal') this.style.display = 'none';
        });
    });
