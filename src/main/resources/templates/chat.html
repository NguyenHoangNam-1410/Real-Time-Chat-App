<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Real-Time Chat Application</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    </head>
    <body>
    <style >
        body {
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .chat-container {
            max-width: 700px;
            margin: auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);

        }

        #chat {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 15px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .incoming {
            background-color: #e2e6ea;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .outgoing {
            background-color: #0d6efd;
            color: white;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .message-sender {
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        .input-group {
            border-radius: 12px;
            overflow: hidden;
        }

        .form-control {
            border: none;
            padding: 14px;
        }

        .form-control:focus {
            box-shadow: none;
        }

        #send-button {
            background-color: #0d6efd;
            border: none;
        }

        #send-button:hover {
            background-color: #0b5ed7;
        }

        h3.text-center {
            font-weight: 600;
            color: #343a40;
        }

        #imageModal img {
            cursor: pointer;
        }

    </style>



    <div class="container mt-5">
        <div class="chat-container">
            <!-- Chat Header -->
            <h3 class="text-center mb-4">Chat Application</h3>

            <!-- Chat Box -->
            <div id="chat" class="d-flex flex-column"></div>

            <!-- User Input Section -->
            <div class="input-group mt-3">
                <input id="senderInput" type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="input-group mt-3">
                <input id="messageInput" type="text" class="form-control" placeholder="Enter your message...">
                <button id="sendMessage" class="btn btn-primary" type="button">Send</button>
            </div>

            <div class="input-group mt-2 align-items-center" id="imageGroup">
                <input id="imageInput" type="file" class="form-control" accept="image/*">
                <button class="btn btn-outline-danger" type="button" id="clearImage" title="Remove attachment">❌</button>
            </div>

            <div id="imageModal" class="modal" style="display:none; position:fixed; z-index:1050; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
                <img id="modalImage" style="max-width:90%; max-height:90%; border-radius:10px;">
            </div>
        </div>
    </div>
    </body>
    <script>
        // Global variables
        var stompClient = null;

        function setConnected(connected) {
            document.getElementById('sendMessage').disabled = !connected;
        }

        function connect() {
            var socket = new SockJS('/chat');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                // Successfully connected
                setConnected(true);
                console.log('Connected: ' + frame);
                stompClient.subscribe('/topic/messages', function (message) {
                    showMessage(JSON.parse(message.body));
                });
            }, function (error) {
                // Error when connecting
                console.error('Error connecting to WebSocket:', error);
                stompClient = null; // Set to null if connection fails
            });
        }

        function showMessage(message) {
            var chat = document.getElementById('chat');
            var messageElement = document.createElement('div');
            var isSender = document.getElementById('senderInput').value === message.sender;
            messageElement.className = 'chat-message ' + (isSender ? 'outgoing' : 'incoming');
            let content = `<span class="message-sender">${message.sender}:</span>`;

            if (message.message) content += `<div>${message.message}</div>`;
            if (message.imageData) content += `<img src="${message.imageData}" style="max-width: 200px; margin-top: 5px; border-radius: 10px;">`;

            messageElement.innerHTML = content;
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            if (!stompClient || !stompClient.connected) {
                alert('Unable to send message. Not connected to the chat server.');
                return;
            }

            var sender = document.getElementById('senderInput').value;
            var message = document.getElementById('messageInput').value;
            var imageInput = document.getElementById('imageInput').files[0];

            if (sender.trim() === '' || (message.trim() === '' && !imageInput)) {
                alert('You must enter a message or select an image.');
                return;
            }

            if (imageInput) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    var base64Image = e.target.result;
                    var chatMessage = {
                        sender: sender,
                        message: message.trim() || null,
                        imageData: base64Image
                    };
                    stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
                };
                reader.readAsDataURL(imageInput);
            } else {
                var chatMessage = { sender: sender, message: message };
                stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
            }

            document.getElementById('messageInput').value = '';
            document.getElementById('imageInput').value = '';
        }




        // Ensure the DOM is fully loaded before binding events
        window.addEventListener('DOMContentLoaded', function () {
            document.getElementById('sendMessage').onclick = sendMessage; // Attach event listener to button
            connect(); // Initialize the connection on page load

            document.getElementById('clearImage').addEventListener('click', function () {
                document.getElementById('imageInput').value = '';
            });

            // Open modal on image click
            document.addEventListener('click', function (e) {
                if (e.target.tagName === 'IMG' && e.target.closest('.chat-message')) {
                    var modal = document.getElementById('imageModal');
                    var modalImg = document.getElementById('modalImage');
                    modal.style.display = 'flex';
                    modalImg.src = e.target.src;
                }
            });

            // Close modal when clicking outside the image
            document.getElementById('imageModal').addEventListener('click', function (e) {
                if (e.target.id === 'imageModal') this.style.display = 'none';
            });
        });
    </script>
</html>
